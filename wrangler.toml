# wrangler.toml
# Tells wrangler what to deploy and what the Worker is allowed to reach.
# Nothing in this file is secret. The database_id is an address, not a key.

name = "mgt3745-hw4"
main = "worker.js"
compatibility_date = "2025-09-01"

# The D1 binding. Your Worker sees this database as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "mgt3745-entries"
# After `npx wrangler d1 create mgt3745-entries`, paste the database_id it
# prints between the quotes below. Keep the quotes. Change nothing else.
database_id = "PASTE_ID_HERE"
